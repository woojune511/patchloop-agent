name: pages

on:
  push:
    branches: [main]
    paths:
      - docs/showcase/**
      - scripts/build_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      - run: python scripts/build_site.py --output "${{ runner.temp }}/patchloop-site"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/patchloop-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static walkthrough
        id: deployment
        uses: actions/deploy-pages@v4
