name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-dev-head:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, shard: 0, shards: 1}
          - {os: windows-latest, shard: 0, shards: 4}
          - {os: windows-latest, shard: 1, shards: 4}
          - {os: windows-latest, shard: 2, shards: 4}
          - {os: windows-latest, shard: 3, shards: 4}
    name: fast-dev-head (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Frozen diagnostic controls read their exact historical source commits.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          python-version: "3.12"
      - run: uv sync --extra dev --locked
      - run: uv run --locked ruff check patchloop tests
      - run: uv run --locked python scripts/build_site.py --output "${{ runner.temp }}/patchloop-site-check"
      - run: >-
          uv run --locked python scripts/pytest_shard.py
          --index ${{ matrix.shard }} --total ${{ matrix.shards }}
          --output "${{ runner.temp }}/pytest-selection.txt"
      - run: >-
          uv run --locked pytest "@${{ runner.temp }}/pytest-selection.txt"
          -n 4 --dist loadfile --max-worker-restart 0
          --durations=20
          --basetemp "${{ runner.temp }}/patchloop-tests"
          --junitxml "${{ runner.temp }}/pytest.xml"
      - run: uv run --locked patchloop task validate tasks/smoke/csv-quoted-newline
      - run: >-
          uv run --locked patchloop dev
          --provider mock
          --task tasks/smoke/csv-quoted-newline/public.yaml
          --model mock-dev
          --repeat 1
        env:
          PATCHLOOP_STATE_ROOT: ${{ runner.temp }}/patchloop-state
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/pytest.xml
          retention-days: 14
