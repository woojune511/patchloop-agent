name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run patchloop task validate tasks/smoke/csv-quoted-newline
      - run: uv run patchloop run --task tasks/smoke/csv-quoted-newline/public.yaml --model mock
