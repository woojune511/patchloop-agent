[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "patchloop"
version = "0.1.0"
description = "Mutable single-agent development and evaluation harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "openai>=2.47,<3",
  "packaging>=24.2,<27",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
patchloop = "patchloop.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["patchloop"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["fixtures", "tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
