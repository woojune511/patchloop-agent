  language: python
issue:
  title: An empty value ignores ${name:-default}
  description: |
    https://github.com/theskumar/python-dotenv/issues/715

    `${name:-default}` is the POSIX form that uses the default when `name` is unset or empty. An empty value is returned as itself.

    ```python
    dotenv.dotenv_values(stream=io.StringIO("b=\na=${b:-d}"))
    # {'b': '', 'a': ''}
    ```

    `a` should be `d`. A missing `b` already becomes `d`. `b=c` still stays `c`. `${b}` with no default stays empty.

    Repair requirements:
    Fix the reported behavior and add regression tests in the existing tests/test_main.py, tests/test_variables.py, or tests/test_parser.py files. Test the public behavior described by the issue. Confirm that the same new tests fail because of this bug before the implementation fix and pass after the fix. Preserve existing tests, assertions, parameter cases, fixtures, and their coverage; do not delete, skip, weaken, or replace them. Do not change dependency or test-runner configuration. Return both the implementation and tests in the original submitted patch. Report which before/after checks you actually ran; do not claim an unexecuted check passed. Any externally performed verification is recorded separately.
