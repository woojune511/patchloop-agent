issue:
  title: Config merge ignores explicit falsey overrides
  description: |
    Explicit override values such as false, zero, an empty string, or an empty
    list are treated as if the key were absent. Preserve merge_config(base,
    override), retain unmentioned base values, and apply every provided value.
