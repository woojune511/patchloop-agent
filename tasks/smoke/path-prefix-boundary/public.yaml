issue:
  title: Path containment accepts sibling prefixes and traversal
  description: |
    is_path_within(path, root) treats sibling names sharing a text prefix as
    descendants and does not normalize dot segments. Preserve the public API,
    support slash and backslash input, and compare complete path segments.
