  path: reference.patch
  sha256: sha256:3f2d45f2116df6bb68432756ae243b27826d42b2a36d856caf55f22085018f7b
audit:
  expected_files:
    - sqlglot/dialects/duckdb.py
    - sqlglot/generator.py
