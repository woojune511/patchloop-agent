  language: python
issue:
  title: Process workers cannot import main from extensionless entrypoints
  description: |
    When a program starts from a console-style entrypoint whose filename does
    not end in .py or .pyc, the process worker cannot reconstruct the parent
    main module. Callables defined by that entrypoint then fail to unpickle, and
    worker code that imports __main__ cannot access the entrypoint globals.

    Load ordinary extensionless and unknown-suffix entrypoint files in process
    workers while preserving normal Python-script behavior. The worker's
    __main__ and multiprocessing-compatible __mp_main__ names must refer to the
    same loaded module, the entrypoint must execute only once per worker, and
    initialization errors must still reach the caller. Do not change public
    APIs or process-pool lifecycle behavior.
constraints:
  allowed_paths:
    - src/anyio/to_process.py
  forbidden_paths:
    - tests/**
    - docs/**
    - .github/**
    - .patchloop-hidden/**
