audit:
  expected_files:
    - loguru/_datetime.py
  prohibited_behaviors:
    - hard-coding UTC or an arbitrary fixed offset for fallback cases
    - clamping an invalid platform offset instead of deriving the local offset
    - reversing the derived local-minus-UTC offset
    - discarding the derived local timezone name
    - losing local wall-clock fields or microseconds
    - ignoring valid negative, zero, or positive platform timezone metadata
    - failing to recover from OSError or OverflowError raised by localtime
    - failing to recover when either platform timezone field is unavailable
    - swallowing unsupported localtime exceptions with an overly broad catch
    - changing tests, documentation, configuration, or dependencies
