issue:
  title: PC stable skeleton changes with column order
  description: |
    The stable variant of PC._build_skeleton currently depends on column/edge
    iteration order. Removing one edge changes the available neighbors for other edges
    tested at the same conditioning-set size. The stable algorithm must use the neighbors
    available at the start of each conditioning round, then refresh them for the next round.

    Given a deterministic symmetric conditional-independence (CI) callback, stable must
    produce the correct skeleton for every column order. For the public three-node example,
    B is independent of C unconditionally, A is independent of B given C, and A is independent
    of C given B. All other callback decisions are dependent. At max_cond_vars=1 no edges
    remain; at max_cond_vars=0 only B-C is removed. Sorting traversal order alone is not a fix.

    Preserve the node set, original input data/columns, conditioning-depth limit, significance
    level passed to the callback, and valid separating-set witnesses for each removed edge.
    Refresh neighbors between conditioning rounds: nodes disconnected in an earlier round
    must not remain available as later separators. Preserve existing required/forbidden edge
    enforcement and temporal-order restrictions. Keep orig as the existing original algorithm
    and preserve parallel behavior. Do not require one particular implementation strategy or
    introduce public API, dependency or test-file changes. If several valid separators exist,
    any valid witness is acceptable; their enumeration order need not be identical.
