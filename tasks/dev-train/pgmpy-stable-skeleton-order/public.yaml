visible_checks:
- id: stable-skeleton-contract
  command:
  - /opt/conda/envs/testbed/bin/python
  - -c
  - |
    """Public deterministic PC examples; symmetric CI decisions avoid sampled-data noise."""

    import itertools
    import json

    import pandas as pd
    import pgmpy.causal_discovery._base as module
    from pgmpy.causal_discovery import PC


    def ci(left, right, conditioning, **kwargs):
        pair, given = frozenset((left, right)), frozenset(conditioning)
        return ((pair == frozenset("BC") and not given)
                or (pair == frozenset("AB") and given == frozenset("C"))
                or (pair == frozenset("AC") and given == frozenset("B")))


    def main():
        assert module.__file__.startswith("/workspace/pgmpy/")
        failures = 0
        cases = 0
        for order in itertools.permutations("ABC"):
            data = pd.DataFrame({name: [0, 1, 0, 1] for name in order})
            for depth in (0, 1):
                graph, sepsets = PC()._build_skeleton(
                    data, ci_test=ci, variant="stable", max_cond_vars=depth, show_progress=False)
                actual = sorted("".join(sorted(edge)) for edge in graph.edges())
                expected = ["AB", "AC"] if depth == 0 else []
                actual_sepsets = {"".join(sorted(pair)): sorted(given) for pair, given in sepsets.items()}
                expected_sepsets = {"BC": []}
                if depth == 1:
                    expected_sepsets.update({"AB": ["C"], "AC": ["B"]})
                passed = (actual == expected and actual_sepsets == expected_sepsets
                          and set(graph) == set(order) and list(data.columns) == list(order))
                cases += 1
                failures += not passed
                print(json.dumps({"order": "".join(order), "max_cond_vars": depth,
                    "passed": passed, "expected_edges": expected, "actual_edges": actual,
                    "expected_separating_sets": expected_sepsets,
                    "actual_separating_sets": actual_sepsets}, sort_keys=True))
        print(f"{cases - failures} passed, {failures} failed")
        return int(failures > 0)


    if __name__ == "__main__":
        raise SystemExit(main())
  timeout_seconds: 30
  environment:
    PYTHONPATH: /workspace
    OMP_NUM_THREADS: '1'
    OPENBLAS_NUM_THREADS: '1'
