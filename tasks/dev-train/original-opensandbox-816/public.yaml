repository:
  url: https://github.com/alibaba/OpenSandbox.git
  base_commit: fb78091f947f62ae2c71a372af42425a764aacee
  language: python
issue:
  title: 'SECURITY: symbolic link within a whitelisted path that points to the host
    root directory `/`, and then request a mount using the symlink path.'
  description: 'SECURITY: symbolic link within a whitelisted path that points to the
    host root directory `/`, and then request a mount using the symlink path.

    The `allowed_host_paths` configuration option in OpenSandbox is intended to restrict
    sandbox containers to a whitelist of host paths that may be mounted. However,
    when validating paths, `_validate_host_volume` only uses `os.path.normpath` for
    lexical normalization and never calls `os.path.realpath` to resolve symbolic links.


    An attacker can create a symbolic link within a whitelisted path that points to
    the host root directory `/`, and then request a mount using the symlink path.
    The lexical validation passes because the path begins with the whitelisted prefix,
    but Docker resolves the symbolic link when performing the bind mount, so the actual
    mounted path can be any host path chosen by the attacker.


    This vulnerability remains exploitable even when the administrator has correctly
    configured the `allowed_host_paths` whitelist, rendering the security mechanism
    completely ineffective.


    # FIXES

    1. Add symbolic link detection in `ensure_valid_host_path`: check whether each
    intermediate path component is a symbolic link, and reject any path that contains
    symlinks.


    2. Align the security validation logic for PVC volumes: `_validate_pvc_volume`
    already uses `os.path.realpath(strict=True)`, and host volumes should enforce
    the same standard.'
constraints:
  allowed_paths:
  - server/**
  forbidden_paths:
  - tests/**
  - '**/tests/**'
  - .patchloop-hidden/**
  max_changed_files: 4
  max_diff_lines: 1000
  dependency_changes_allowed: false
  public_api_changes_allowed: true
visible_checks:
- id: base-regression
  command:
  - /opt/conda/envs/testbed/bin/python
  - -B
  - -c
  - "import os, shutil, subprocess, sys, tempfile\nfrom pathlib import Path\nwith\
    \ tempfile.TemporaryDirectory(prefix=\"public-tests-\") as temp:\n    checkout\
    \ = Path(temp) / \"repo\"\n    shutil.copytree(Path.cwd(), checkout,\n       \
    \            ignore=shutil.ignore_patterns(\".git\", \".patchloop-hidden\", \"\
    __pycache__\"))\n    env = dict(os.environ)\n    env[\"PYTHONPATH\"] = str(checkout\
    \ / \"server\") + os.pathsep + str(checkout)\n    env[\"PATH\"] = str(Path(sys.executable).parent)\
    \ + os.pathsep + env[\"PATH\"]\n    result = subprocess.run([sys.executable, \"\
    -m\", *sys.argv[1:]], cwd=checkout, env=env)\n    raise SystemExit(result.returncode)\n"
  - pytest
  - --no-header
  - -rA
  - --tb=line
  - --color=no
  - -p
  - no:cacheprovider
  - server/tests/test_docker_service.py
  timeout_seconds: 120
  infrastructure_exit_codes:
  - 2
  - 3
  - 4
  - 5
  environment:
    PYTHONPATH: /workspace
