schema_version: task-public-v1
task_id: hf-hub-xet-endpoint-propagation
task_version: 6
split: dev-train
repository:
  url: https://github.com/huggingface/huggingface_hub.git
  base_commit: 6f9b87ecda5025259c69a1eb0ae6f8ee80d05d33
  language: python
issue:
  title: Custom Hub endpoint is ignored by Xet refresh metadata
  description: |
    A client configured with a custom Hub endpoint can request file metadata
    from that endpoint while receiving Xet refresh metadata that still points
    at the default Hugging Face host.

    Ensure request-specific endpoint context is preserved through every file
    metadata access path. Rebase refresh routes owned by the default Hub origin
    onto the configured endpoint, while preserving relative routes, routes
    already owned by another origin, and callers that do not provide an
    explicit endpoint.
constraints:
  allowed_paths:
  - src/huggingface_hub/file_download.py
  - src/huggingface_hub/hf_api.py
  - src/huggingface_hub/utils/_xet.py
  forbidden_paths:
  - tests/**
  - docs/**
  - .patchloop-hidden/**
  - pyproject.toml
  - setup.py
  - setup.cfg
  - requirements*.txt
  max_changed_files: 3
  max_diff_lines: 80
  dependency_changes_allowed: false
  public_api_changes_allowed: true
visible_checks:
- id: xet-endpoint-contract
  command:
  - /usr/local/bin/python
  - -B
  - -c
  - |-
    import sys
    exec(compile(sys.argv[1], '<public-xet-contract>', 'exec'))
  - |
    """Public endpoint ownership through existing metadata and download APIs."""

    import json
    import os
    import subprocess
    import sys
    from collections import defaultdict
    from pathlib import Path
    from tempfile import TemporaryDirectory
    from unittest.mock import patch

    DEFAULT = "https://huggingface.co"
    CUSTOM = "https://mirror.example.test:8443"
    FILE_PATH = "/public-fixture/repo/resolve/main/config.json"
    REFRESH_PATH = "/api/models/public-fixture/repo/xet-read-token/main?aud=read#refresh"
    FILE_HASH = "public-fixture-xet-hash"
    REQUEST = CUSTOM + "/hub"
    AMBIENT = "https://ambient.example.test:9443/global"
    ENVIRONMENTS = {"same": REQUEST, "other": AMBIENT}


    def cases():
        # The public origin contract treats case and an explicit default port as equivalent.
        routes = (
            ("default", DEFAULT + REFRESH_PATH, True),
            ("relative", REFRESH_PATH, False),
            ("foreign", "https://storage.example.test" + REFRESH_PATH, False),
            ("host-case", "https://HUGGINGFACE.CO" + REFRESH_PATH, True),
            ("scheme-case", "HTTPS://huggingface.co" + REFRESH_PATH, True),
            ("default-port", "https://huggingface.co:443" + REFRESH_PATH, True),
            ("foreign-port", "https://huggingface.co:444" + REFRESH_PATH, False),
            ("foreign-scheme", "http://huggingface.co" + REFRESH_PATH, False),
            ("lookalike-host", "https://huggingface.co.example.test" + REFRESH_PATH, False),
            ("network-relative", "//huggingface.co" + REFRESH_PATH, False),
        )
        rows = []
        for entry, origin in (
            ("direct-no-endpoint", CUSTOM),
            ("client-custom-url", CUSTOM),
            ("client-default-url", DEFAULT),
            ("download-custom", CUSTOM),
            ("download-local", CUSTOM),
        ):
            for carrier in ("header", "link"):
                for kind, route, same_origin in routes:
                    rows.append(
                        dict(
                            id=f"{entry}-{carrier}-{kind}",
                            entry=entry,
                            kind=kind,
                            url=origin + FILE_PATH,
                            carrier=carrier,
                            route=route,
                            expected=CUSTOM + REFRESH_PATH
                            if entry != "direct-no-endpoint" and same_origin
                            else route,
                        )
                    )
        for prefix_kind, prefix in (
            ("path-prefix", "/hub"),
            ("encoded-path-prefix", "/team%2Falpha/hub"),
        ):
            endpoint = CUSTOM + prefix
            for entry in (
                "direct-no-endpoint",
                "client-custom-url",
                "download-custom",
                "download-local",
                "client-download-cache",
                "client-download-local",
            ):
                for carrier in ("header", "link"):
                    for route_kind, route, rebase in (
                        ("default", DEFAULT + REFRESH_PATH, True),
                        ("relative", REFRESH_PATH, False),
                        ("foreign", "https://storage.example.test" + REFRESH_PATH, False),
                        ("already-custom", endpoint + REFRESH_PATH, False),
                    ):
                        rows.append(
                            dict(
                                id=f"{prefix_kind}-{entry}-{carrier}-{route_kind}",
                                entry=entry,
                                kind=prefix_kind,
                                route_kind=route_kind,
                                endpoint=endpoint,
                                url=endpoint + FILE_PATH,
                                carrier=carrier,
                                route=route,
                                expected=endpoint + REFRESH_PATH
                                if entry != "direct-no-endpoint" and rebase
                                else route,
                            )
                        )

        for environment_kind, environment in ENVIRONMENTS.items():
            for entry in (
                "direct-no-endpoint",
                "client-custom-url",
                "download-custom",
                "download-local",
                "client-download-cache",
                "client-download-local",
            ):
                for carrier in ("header", "link"):
                    for route_kind, route, rebase in (
                        ("default", DEFAULT + REFRESH_PATH, True),
                        ("relative", REFRESH_PATH, False),
                        ("already-custom", REQUEST + REFRESH_PATH, False),
                        ("ambient-foreign", AMBIENT + REFRESH_PATH, False),
                    ):
                        rows.append(
                            dict(
                                id=f"env-{environment_kind}-{entry}-{carrier}-{route_kind}",
                                entry=entry,
                                kind=f"env-{environment_kind}-{route_kind}",
                                route_kind=route_kind,
                                endpoint=REQUEST,
                                environment=environment,
                                url=REQUEST + FILE_PATH,
                                carrier=carrier,
                                route=route,
                                expected=REQUEST + REFRESH_PATH
                                if entry != "direct-no-endpoint" and rebase
                                else route,
                            )
                        )
        return rows


    def observe(selected_cases):
        import requests
        from huggingface_hub import constants, file_download, hf_api
        from huggingface_hub.utils import _xet

        for module, relative in (
            (file_download, "file_download.py"),
            (hf_api, "hf_api.py"),
            (_xet, "utils/_xet.py"),
        ):
            assert Path(module.__file__).resolve() == Path("/workspace/src/huggingface_hub") / relative

        def no_network(*args, **kwargs):
            raise AssertionError("Unexpected HTTP request outside the controlled HEAD response")

        def observe_case(case):
            requested, transfers = [], []

            def head_response(*args, **kwargs):
                assert kwargs["method"] == "HEAD"
                requested.append(kwargs["url"])
                response = requests.Response()
                response.status_code = 200
                response.url = kwargs["url"]
                response.request = requests.Request("HEAD", kwargs["url"]).prepare()
                response.headers.update(
                    {
                        "X-Repo-Commit": "a" * 40,
                        "ETag": '"fixture-etag"',
                        "Content-Length": "0",
                        "X-Xet-Hash": FILE_HASH,
                    }
                )
                if case["carrier"] == "header":
                    response.headers["X-Xet-Refresh-Route"] = case["route"]
                else:
                    response.headers["Link"] = f'<{case["route"]}>; rel="xet-auth"'
                return response

            def capture_transfer(**kwargs):
                transfers.append(kwargs["xet_file_data"])
                Path(kwargs["destination_path"]).write_bytes(b"")

            row = dict(
                id=case["id"],
                route=None,
                file_hash=None,
                requests=requested,
                transfer_count=0,
                error=None,
            )
            if "environment" in case:
                row.update(
                    environment=constants.ENDPOINT, default_origin=constants._HF_DEFAULT_ENDPOINT
                )
            try:
                with (
                    patch.object(requests.sessions.Session, "request", no_network),
                    patch.object(file_download, "_request_wrapper", head_response),
                    patch.object(file_download, "_download_to_tmp_and_move", capture_transfer),
                    TemporaryDirectory(prefix="public-xet-") as temporary,
                ):
                    entry = case["entry"]
                    endpoint = case.get("endpoint", CUSTOM)
                    if entry == "direct-no-endpoint":
                        data = file_download.get_hf_file_metadata(
                            case["url"], token=False
                        ).xet_file_data
                    elif "download-" in entry:
                        is_client = entry.startswith("client-")
                        client = hf_api.HfApi(endpoint=endpoint, token=False)
                        download = (
                            client.hf_hub_download if is_client else file_download.hf_hub_download
                        )
                        context = {} if is_client else {"endpoint": endpoint}
                        destination = (
                            {"local_dir": Path(temporary) / "local"} if entry.endswith("local") else {}
                        )
                        result = download(
                            "public-fixture/repo",
                            "config.json",
                            token=False,
                            cache_dir=Path(temporary) / "cache",
                            force_download=True,
                            **context,
                            **destination,
                        )
                        assert Path(result).is_file() and len(transfers) == 1
                        data = transfers[0]
                    else:
                        client = hf_api.HfApi(endpoint=endpoint, token=False)
                        data = client.get_hf_file_metadata(url=case["url"]).xet_file_data
                    row.update(route=data.refresh_route, file_hash=data.file_hash)
            except Exception as error:
                row["error"] = f"{type(error).__name__}: {str(error)[:180]}"
            row["transfer_count"] = len(transfers)
            return row

        return [observe_case(case) for case in selected_cases]


    def report(rows):
        expected = cases()
        if [row.get("id") for row in rows] != [case["id"] for case in expected]:
            print("FAILED case-manifest - missing, duplicate or reordered public observations")
            return 1
        failures = defaultdict(list)
        for case, row in zip(expected, rows, strict=True):
            checks = (
                ("route", case["expected"], row.get("route")),
                ("file_hash", FILE_HASH, row.get("file_hash")),
                ("requests", [case["url"]], row.get("requests")),
                (
                    "transfer_count",
                    int("download-" in case["entry"]),
                    row.get("transfer_count"),
                ),
                ("error", None, row.get("error")),
            )
            if "environment" in case:
                checks += (
                    ("environment", case["environment"], row.get("environment")),
                    ("default_origin", DEFAULT, row.get("default_origin")),
                )
            mismatches = [
                f"{name} expected={want!r} actual={got!r}" for name, want, got in checks if want != got
            ]
            if mismatches:
                failures[case["kind"]].append((case["id"], "; ".join(mismatches)))
        for kind, group in failures.items():
            case_id, detail = group[0]
            print(f"FAILED {kind} - {len(group)} cases; example={case_id}; {detail}")
        failed = sum(len(group) for group in failures.values())
        print(f"{len(expected) - failed} passed, {failed} failed")
        return int(failed != 0)


    def observe_all(source):
        selected = cases()
        rows = observe([case for case in selected if "environment" not in case])
        for environment in ENVIRONMENTS.values():
            group = [case for case in selected if case.get("environment") == environment]
            child = subprocess.run(
                [sys.executable, "-B", "-c", source, "--environment-worker"],
                input=json.dumps(group),
                env={**os.environ, "HF_ENDPOINT": environment, "HUGGINGFACE_CO_STAGING": "0"},
                capture_output=True,
                text=True,
                check=True,
                timeout=20,
            )
            rows.extend(json.loads(child.stdout))
        return rows


    if __name__ == "__main__":
        if sys.argv[1] == "--environment-worker":
            print(json.dumps(observe(json.load(sys.stdin)), separators=(",", ":")))
        else:
            raise SystemExit(report(observe_all(sys.argv[1])))
  timeout_seconds: 60
  working_directory: .
  environment:
    HF_ENDPOINT: https://huggingface.co
    HF_HOME: /tmp/hf-home
    HF_HUB_DISABLE_PROGRESS_BARS: '1'
    HF_HUB_DISABLE_TELEMETRY: '1'
    PYTHONPATH: /workspace/src
    PYTHONPYCACHEPREFIX: /tmp/pycache
    XDG_CACHE_HOME: /tmp/xdg-cache
  expected_exit_codes:
  - 0
  output_limit_bytes: 200000
- id: upstream-xet-regression
  command:
  - /usr/local/bin/python
  - -m
  - pytest
  - --no-header
  - -q
  - -p
  - no:cacheprovider
  - -W
  - ignore::DeprecationWarning
  - tests/test_xet_utils.py
  timeout_seconds: 60
  environment:
    PYTHONPATH: /workspace/src
    PYTHONPYCACHEPREFIX: /tmp/pycache
    XDG_CACHE_HOME: /tmp/xdg-cache
    HF_HOME: /tmp/hf-home
