issue:
  title: Elapsed-time formatter rounds incomplete minutes upward
  description: |
    Durations of at least 60 seconds must report only fully completed minutes.
    Values below 60 seconds must remain in seconds, negative durations must
    remain invalid, and the public format_elapsed(seconds) interface must not
    change.
