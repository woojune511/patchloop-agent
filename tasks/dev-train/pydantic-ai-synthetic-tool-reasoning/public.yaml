visible_checks:
- id: synthetic-tool-history-contract
  command:
  - /pydantic-ai/.venv/bin/python
  - -c
  - |
    """Public synthetic tool-turn examples, with fixed offline replies only."""

    import asyncio
    import json
    import socket

    import httpx
    from openai import AsyncOpenAI

    import pydantic_ai
    from pydantic_ai import Agent, ModelResponse, TextPart, ThinkingPart, ToolCallPart
    from pydantic_ai.capabilities import Capability
    from pydantic_ai.models.openai import OpenAIChatModel
    from pydantic_ai.profiles.openai import OpenAIModelProfile
    from pydantic_ai.providers.deepseek import DeepSeekProvider
    from pydantic_ai.providers.openai import OpenAIProvider


    def forbidden(*args, **kwargs):
        raise AssertionError("Public check must not use network connections")


    socket.socket.connect = forbidden
    socket.create_connection = forbidden


    async def main():
        assert pydantic_ai.__file__.startswith("/workspace/pydantic_ai_slim/")
        observations = []

        def observe(name, actual, expected):
            observations.append(actual == expected)
            print(json.dumps({"case": name, "passed": actual == expected,
                              "actual": actual, "expected": expected}, sort_keys=True))

        async with httpx.AsyncClient(transport=httpx.MockTransport(forbidden)) as http:
            client = AsyncOpenAI(api_key="fixture-only", base_url="https://fixture.invalid",
                                 max_retries=0, http_client=http)
            deepseek = DeepSeekProvider(openai_client=client)
            call = ToolCallPart("roll_dice", {}, tool_call_id="public-call")
            expected = {"role": "assistant", "content": None, "reasoning_content": "",
                        "tool_calls": [{"id": "public-call", "type": "function",
                                        "function": {"name": "roll_dice", "arguments": "{}"}}]}
            for name in ("deepseek-v4-flash", "deepseek-reasoner"):
                model = OpenAIChatModel(name, provider=deepseek)
                observe(name + " tool-only", model._map_model_response(ModelResponse(parts=[call])), expected)
            original = model._map_model_response(ModelResponse(parts=[
                ThinkingPart("public-fixture", id="reasoning_content", provider_name="deepseek"),
                TextPart("checking"), call]))
            observe("existing reasoning and text", original,
                    {**expected, "reasoning_content": "public-fixture", "content": "checking"})
            plain = OpenAIChatModel("fixture-other", provider=OpenAIProvider(openai_client=client))
            without_field = {key: value for key, value in expected.items() if key != "reasoning_content"}
            observe("other provider", plain._map_model_response(ModelResponse(parts=[call])), without_field)
            disabled = OpenAIChatModel("deepseek-v4-flash", provider=deepseek,
                profile=OpenAIModelProfile(openai_chat_send_back_thinking_parts=False))
            observe("explicit disable", disabled._map_model_response(ModelResponse(parts=[call])), without_field)
            observe("empty response", model._map_model_response(ModelResponse(parts=[])), None)

        for deferred in (False, True):
            bodies = []

            def roll_dice() -> str:
                """Return the fixed public example die roll."""
                return "4"

            async def handler(request):
                assert request.url.host == "fixture.invalid"
                bodies.append(json.loads(request.content))
                index = len(bodies)
                assert index <= 3
                message = {"role": "assistant", "content": None,
                           "reasoning_content": f"public-fixture-{index}"}
                if deferred and index == 1:
                    name, arguments = "load_capability", {"id": "DICE"}
                elif index == (2 if deferred else 1):
                    name, arguments = "roll_dice", {}
                else:
                    name, arguments = None, None
                if name:
                    message["tool_calls"] = [{"id": f"public-{index}", "type": "function",
                        "function": {"name": name, "arguments": json.dumps(arguments)}}]
                else:
                    message["content"] = "done"
                return httpx.Response(200, json={"id": f"public-{index}", "object": "chat.completion",
                    "created": 1, "model": "deepseek-v4-flash",
                    "choices": [{"index": 0, "message": message, "finish_reason": "tool_calls" if name else "stop"}],
                    "usage": {"prompt_tokens": 1, "completion_tokens": 1, "total_tokens": 2}})

            async with httpx.AsyncClient(transport=httpx.MockTransport(handler)) as http:
                client = AsyncOpenAI(api_key="fixture-only", base_url="https://fixture.invalid",
                                     max_retries=0, http_client=http)
                model = OpenAIChatModel("deepseek-v4-flash", provider=DeepSeekProvider(openai_client=client))
                agent = Agent(model, capabilities=[Capability(id="DICE", tools=[roll_dice], defer_loading=deferred)])
                result = await agent.run("Roll the example die.")
                assert result.output == "done"
            tool_messages = [m for m in bodies[-1]["messages"] if m["role"] == "assistant" and m.get("tool_calls")]
            fields_present = all(isinstance(m.get("reasoning_content"), str) for m in tool_messages)
            names = [call["function"]["name"] for m in tool_messages for call in m["tool_calls"]]
            observe(f"deferred={deferred} complete history",
                    {"fields_present": fields_present, "tool_names": names},
                    {"fields_present": True,
                     "tool_names": ["load_capability", "search_tools", "roll_dice"] if deferred else ["roll_dice"]})
        failures = len(observations) - sum(observations)
        print(f"{sum(observations)} passed, {failures} failed")
        return int(failures > 0)


    if __name__ == "__main__":
        raise SystemExit(asyncio.run(main()))
  timeout_seconds: 40
  output_limit_bytes: 20000
  environment:
    PYTHONPATH: /workspace/pydantic_ai_slim:/workspace/pydantic_graph
