issue:
  title: Chunked CSV parser drops the final unterminated record
  description: |
    A valid final CSV record is lost when the input ends without a trailing
    newline. Records may span input chunks and quoted commas must remain
    supported. Preserve the public parse_chunks(chunks) interface and existing
    behavior for newline-terminated records.
