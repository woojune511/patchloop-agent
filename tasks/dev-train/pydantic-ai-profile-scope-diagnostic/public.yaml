issue:
  title: DeepSeek tool-call history must include configured reasoning metadata
  description: |
    Deferred capability loading can synthesize assistant tool-search messages without a
    ThinkingPart. With DeepSeekProvider's default field-based thinking replay, these tool-call
    messages omit reasoning_content and violate the conversation contract. Supply the configured
    thinking field as an empty string when an emitted assistant tool-call message has no thinking
    content. Apply this to ordinary tool calls and synthesized tool-search history, including
    multiple deferred capability loads and replay across later requests.

    Preserve existing thinking content, text, tool-call names/arguments/IDs/order, and tool returns.
    Do not invent reasoning or copy another message's thinking. Empty responses must remain omitted.
    The provider's supplied profile carries this requirement; retain it when that profile is reused
    with an OpenAI-compatible client or copied with a different thinking field name. Honor that
    chosen field name. Preserve the existing tags, auto and disabled thinking-send modes: empty-field
    insertion applies only in field mode with a nonempty configured field name. Plain OpenAI profiles
    and other providers must keep their existing behavior unless given such a provider profile.

    Preserve current provider/model interfaces and profile overrides. A backwards-compatible optional
    profile setting is permitted; its name or implementation is not prescribed. Do not change
    dependencies, tests or unrelated features. Keep deferred loading and search exchanges intact.
    Checks use deterministic local response fixtures; no real provider request is needed.
