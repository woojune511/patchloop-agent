schema_version: task-public-v1
task_id: loguru-invalid-format-feedback
task_version: 3
split: dev-train
repository:
  url: https://github.com/Delgan/loguru.git
  base_commit: 2abeb0fa6d7be4b0455c6e0b580b1e9dab19005e
  language: python
issue:
  title: Invalid logger format keys do not provide actionable feedback
  description: |
    A static format passed to logger.add() can reference a record key that does
    not exist. The resulting runtime KeyError is currently difficult to diagnose.
    Improve that feedback so it identifies the missing key, reports the available
    record keys, and explains how custom values should be supplied and referenced.
    For ordinary contextual values, the guidance should include the canonical
    logger.bind() and {extra[key]} pairing without requiring one exact sentence.

    Preserve the existing catch contract: catch=True must report the logging error
    without propagating it, while catch=False must raise a useful KeyError. Existing
    valid formats, including fields injected by a configured patcher, must continue
    to work.
constraints:
  allowed_paths:
    - loguru/_handler.py
  forbidden_paths:
    - tests/**
    - .patchloop-hidden/**
    - pyproject.toml
    - requirements.txt
  max_changed_files: 1
  max_diff_lines: 60
  dependency_changes_allowed: false
  public_api_changes_allowed: false
visible_checks:
  - id: invalid-format-feedback-contract
    command:
      - python
      - -c
      - |
        import contextlib
        import io

        from loguru import logger

        def assert_actionable(text, missing_key):
            lowered = text.lower()
            assert missing_key in text, text
            assert "available" in lowered, text
            assert "message" in text and "extra" in text, text
            assert "bind" in lowered, text
            assert "{extra[" in text, text

        logger.remove()
        logger.add(lambda message: None, format="{missing_public_field}", catch=False)
        try:
            logger.info("catch-false")
        except KeyError as error:
            assert_actionable(str(error), "missing_public_field")
        else:
            raise AssertionError("catch=False did not propagate KeyError")

        logger.remove()
        logger.add(lambda message: None, format="{missing_report_field}", catch=True)
        stderr = io.StringIO()
        with contextlib.redirect_stderr(stderr):
            logger.info("catch-true")
        assert_actionable(stderr.getvalue(), "missing_report_field")
    timeout_seconds: 30
  - id: upstream-format-regression
    command:
      - /opt/conda/envs/testbed/bin/python
      - -m
      - pytest
      - -q
      - -p
      - no:cacheprovider
      - tests/test_add_option_format.py
    timeout_seconds: 60
  - id: basic-format-regression
    command:
      - python
      - -c
      - |
        from loguru import logger
        logger.remove()
        output = []
        logger.add(output.append, format="{level.name}:{message}", catch=False)
        logger.info("ready")
        assert len(output) == 1
        assert str(output[0]).strip() == "INFO:ready"
    timeout_seconds: 30
  - id: patcher-field-regression
    command:
      - python
      - -c
      - |
        from loguru import logger
        logger.remove()
        output = []
        logger.configure(patcher=lambda record: record.update(request_id="req-7"))
        logger.add(output.append, format="{message}:{request_id}", catch=False)
        logger.info("ready")
        assert len(output) == 1
        assert str(output[0]).strip() == "ready:req-7"
    timeout_seconds: 30
tags:
  - swe-rebench
  - real-repository
  - error-diagnostics
  - format-semantics
  - memory-development
