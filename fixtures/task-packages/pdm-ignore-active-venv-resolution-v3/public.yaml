schema_version: task-public-v1
task_id: pdm-ignore-active-venv-resolution
task_version: 3
split: dev-validation
repository:
  url: https://github.com/pdm-project/pdm.git
  base_commit: 881cd4e38d31663ae67bdae227ec1ccdfd5e2c77
  language: python
issue:
  title: Ignoring the active virtualenv disables interpreter resolution
  description: |
    A project configured to use virtual environments can report that no
    compatible Python exists as soon as PDM_IGNORE_ACTIVE_VENV is enabled,
    even when another associated environment is eligible or the normal
    environment-creation fallback is available.

    Treat the setting as an exclusion of the currently active environment,
    not as a switch that disables virtualenv resolution. Preserve normal
    active-environment reuse for unset and false-like values. The behavior
    must work for both VIRTUAL_ENV and CONDA_PREFIX without confusing sibling
    paths with descendants of the active environment.
constraints:
  allowed_paths:
    - src/pdm/project/core.py
  forbidden_paths:
    - tests/**
    - news/**
    - docs/**
    - .patchloop-hidden/**
    - pyproject.toml
    - pdm.lock
    - requirements*.txt
  max_changed_files: 1
  max_diff_lines: 60
  dependency_changes_allowed: false
  public_api_changes_allowed: false
visible_checks:
  - id: public-ignore-active-venv-resolution
    command:
      - /usr/local/bin/python
      - -c
      - |-
        import os
        import tempfile
        from pathlib import Path
        from types import SimpleNamespace
        from unittest.mock import PropertyMock, patch

        from pdm.exceptions import NoPythonVersion
        from pdm.project.core import Project

        class FakePython:
            def __init__(self, path):
                self.path = Path(path).resolve()
                self.valid = True
                self.version = object()

        class UI:
            def info(self, *args, **kwargs):
                pass

            def warn(self, *args, **kwargs):
                pass

        def resolve_case(*, ignore, virtual_env, conda_prefix, candidates, expected):
            with tempfile.TemporaryDirectory() as temp:
                root = Path(temp)
                project = object.__new__(Project)
                project.root = root / "project"
                project.root.mkdir()
                project.is_global = False
                project.core = SimpleNamespace(ui=UI())
                project._python = None
                project.__dict__["config"] = {"python.use_venv": True}
                project.iter_interpreters = lambda **kwargs: iter(())
                project._create_virtualenv = lambda: root / "created"

                def env_path(value):
                    if value is None or value == "":
                        return value
                    return str(root / value)

                environment = {}
                if ignore is not None:
                    environment["PDM_IGNORE_ACTIVE_VENV"] = ignore
                if virtual_env is not None:
                    environment["VIRTUAL_ENV"] = env_path(virtual_env)
                if conda_prefix is not None:
                    environment["CONDA_PREFIX"] = env_path(conda_prefix)
                venvs = [
                    (
                        name,
                        SimpleNamespace(
                            root=root / name,
                            interpreter=root / name / "bin" / "python",
                        ),
                    )
                    for name in candidates
                ]
                with (
                    patch.dict(os.environ, environment, clear=True),
                    patch("pdm.project.core.is_conda_base", return_value=False),
                    patch(
                        "pdm.project.core.PythonInfo.from_path",
                        side_effect=lambda value: FakePython(value),
                    ),
                    patch(
                        "pdm.models.venv.get_venv_python",
                        side_effect=lambda value: Path(value) / "bin" / "python",
                    ),
                    patch("pdm.cli.commands.venv.utils.iter_venvs", return_value=venvs),
                    patch.object(Project, "python_requires", new_callable=PropertyMock) as requires,
                ):
                    requires.return_value = SimpleNamespace(contains=lambda *args: True)
                    try:
                        result = project.resolve_interpreter()
                    except NoPythonVersion as exc:
                        raise AssertionError(
                            "public behavior mismatch: interpreter resolution stopped"
                        ) from exc
                assert result.path == (root / expected / "bin" / "python").resolve(), (
                    ignore,
                    virtual_env,
                    conda_prefix,
                    candidates,
                    result.path,
                )

        for false_like in (None, "", "0", "false", "NO", "off"):
            resolve_case(
                ignore=false_like,
                virtual_env="active",
                conda_prefix=None,
                candidates=(),
                expected="active",
            )
        resolve_case(
            ignore="0",
            virtual_env="",
            conda_prefix="conda",
            candidates=(),
            expected="conda",
        )
        resolve_case(
            ignore="1",
            virtual_env="active",
            conda_prefix=None,
            candidates=("active", "active/child", "active-sibling"),
            expected="active-sibling",
        )
        resolve_case(
            ignore="yes",
            virtual_env=None,
            conda_prefix="active",
            candidates=("active", "other"),
            expected="other",
        )
        resolve_case(
            ignore="1",
            virtual_env="active",
            conda_prefix=None,
            candidates=(),
            expected="created",
        )
    timeout_seconds: 30
    environment:
      PYTHONPATH: /workspace/src
      PYTHONPYCACHEPREFIX: /tmp/pycache
      XDG_CACHE_HOME: /tmp/xdg-cache
      XDG_CONFIG_HOME: /tmp/xdg-config
      XDG_DATA_HOME: /tmp/xdg-data
      PDM_HOME: /tmp/pdm-home
      HOME: /tmp/home
      CI: "1"
      PDM_CHECK_UPDATE: "0"
  - id: upstream-project-regression
    command:
      - /usr/local/bin/python
      - -m
      - pytest
      - --no-header
      - -q
      - -p
      - no:cacheprovider
      - -W
      - ignore::DeprecationWarning
      - tests/test_project.py
    timeout_seconds: 90
    environment:
      PYTHONPATH: /workspace/src
      PYTHONPYCACHEPREFIX: /tmp/pycache
      XDG_CACHE_HOME: /tmp/xdg-cache
      XDG_CONFIG_HOME: /tmp/xdg-config
      XDG_DATA_HOME: /tmp/xdg-data
      PDM_HOME: /tmp/pdm-home
      HOME: /tmp/home
      CI: "1"
      PDM_CHECK_UPDATE: "0"
tags:
  - swe-rebench-v2
  - real-repository
  - interpreter-resolution
  - virtualenv-selection
  - memory-development
  - development-validation
  - public-behavior-check-v3
